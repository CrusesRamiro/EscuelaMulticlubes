<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia - Escuela Multiclubes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="card header card-padding">
            <h1 class="title">📋 Confirmar Asistencia</h1>
            <p class="subtitle">Marca si asistirás a la próxima clase</p>
        </div>

        <div id="message" style="display: none;"></div>

        <div class="card card-padding">
            <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.5rem; color: #4f46e5; text-decoration: none; margin-bottom: 1.5rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Volver al inicio
            </a>

            <div class="info-box">
                <p class="info-text">
                    Próxima sesión: <strong id="nextSessionDate">Cargando...</strong>
                </p>
            </div>

            <div class="form-group space-y">
                <label class="label">Busca y selecciona al alumno</label>
                <input
                    type="search"
                    id="alumnoInput"
                    class="input"
                    placeholder="Escribe el nombre del alumno..."
                    list="alumnosList"
                >
                <datalist id="alumnosList">
                </datalist>
                <p id="alumnosCount" class="info-text" style="margin-top:0.5rem;">Cargando alumnos...</p>
                <input type="hidden" id="alumnoId">
            </div>

            <div class="grid-2 space-y">
                <button id="btnAsiste" class="btn btn-success" disabled>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <span>Sí Asiste</span>
                </button>
                <button id="btnNoAsiste" class="btn btn-danger" disabled>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span>No Asiste</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        let nextSessionDate = '';
        let alumnosData = [];
        const alumnoInput = document.getElementById('alumnoInput');
        const alumnosList = document.getElementById('alumnosList');
        const alumnoId = document.getElementById('alumnoId');
        const btnAsiste = document.getElementById('btnAsiste');
        const btnNoAsiste = document.getElementById('btnNoAsiste');

        // Cargar datos al iniciar
        async function init() {
            try {
                nextSessionDate = await fetchProximaFecha('clase-semanal');
                document.getElementById('nextSessionDate').textContent = formatDate(nextSessionDate);
            } catch (error) {
                document.getElementById('nextSessionDate').textContent = 'No disponible';
            }
            await loadAlumnos();
        }

        // Cargar lista de alumnos
        async function loadAlumnos() {
            try {
                alumnosData = await fetchAlumnosPublico();
                console.log('Alumnos cargados:', alumnosData ? alumnosData.length : 0);
                updateDatalist(alumnosData);
                const countEl = document.getElementById('alumnosCount');
                if (countEl) countEl.textContent = alumnosData && alumnosData.length ? `${alumnosData.length} alumnos cargados` : 'No se encontraron alumnos';
            } catch (error) {
                showMessage('message', 'error', 'Error cargando alumnos');
                const countEl = document.getElementById('alumnosCount');
                if (countEl) countEl.textContent = 'Error cargando alumnos';
                console.error('Error loadAlumnos:', error);
            }
        }

        // Actualizar datalist con alumnos
        function updateDatalist(alumnos) {
            alumnosList.innerHTML = '';
            if (!alumnos || alumnos.length === 0) return;
            alumnos.forEach(alumno => {
                const option = document.createElement('option');
                option.value = alumno.nombre_completo;
                option.setAttribute('data-id', alumno.id);
                alumnosList.appendChild(option);
            });
        }

        // Manejar cambio en el input
        alumnoInput.addEventListener('input', () => {
            const inputValue = alumnoInput.value;
            // Intentar encontrar por datos cargados
            const selectedAlumno = alumnosData.find(a => a.nombre_completo === inputValue);

            if (selectedAlumno) {
                alumnoId.value = selectedAlumno.id;
                btnAsiste.disabled = false;
                btnNoAsiste.disabled = false;
                return;
            }

            // Fallback: buscar en las opciones del datalist (por si el nombre viene formateado diferente)
            const opt = Array.from(alumnosList.options).find(o => o.value === inputValue);
            if (opt && opt.dataset && opt.dataset.id) {
                alumnoId.value = opt.dataset.id;
                btnAsiste.disabled = false;
                btnNoAsiste.disabled = false;
                return;
            }

            alumnoId.value = '';
            btnAsiste.disabled = true;
            btnNoAsiste.disabled = true;
        });

        // Limpiar input al hacer blur si no hay selección válida
        alumnoInput.addEventListener('blur', () => {
            setTimeout(() => {
                if (!alumnoId.value) {
                    alumnoInput.value = '';
                }
            }, 200);
        });

        // Manejar asistencia
        async function handleAttendance(presente) {
            if (!alumnoId.value) {
                showMessage('message', 'error', 'Por favor selecciona un alumno');
                return;
            }

            // Deshabilitar botones
            btnAsiste.disabled = true;
            btnNoAsiste.disabled = true;

            try {
                await confirmarAsistencia(parseInt(alumnoId.value), 'clase-semanal', presente);
                showMessage('message', 'success',
                    `Asistencia registrada: ${presente ? 'Asistirá' : 'No asistirá'}`);
                alumnoInput.value = '';
                alumnoId.value = '';
            } catch (error) {
                showMessage('message', 'error', 'Error al registrar. Intentá de nuevo.');
            } finally {
                btnAsiste.disabled = !alumnoId.value;
                btnNoAsiste.disabled = !alumnoId.value;
            }
        }

        // Event listeners para botones
        btnAsiste.addEventListener('click', () => handleAttendance(true));
        btnNoAsiste.addEventListener('click', () => handleAttendance(false));

        // Inicializar
        init();
    </script>
</body>
</html>
