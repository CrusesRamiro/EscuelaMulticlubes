<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Alumno - Club de Hockey</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="card header card-padding">
            <h1 class="title">🏒 Registrar Alumno</h1>
            <p class="subtitle">Completa el formulario para dar de alta un nuevo alumno</p>
        </div>

        <div id="message" style="display: none;"></div>

        <div class="card card-padding">
            <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.5rem; color: #4f46e5; text-decoration: none; margin-bottom: 1.5rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Volver al inicio
            </a>

            <form id="registroForm">
                <div class="form-group">
                    <label class="label">DNI del Alumno *</label>
                    <input type="number" id="dni" name="dni" class="input" required>
                </div>

                <div class="form-group">
                    <label class="label">Nombre Completo *</label>
                    <input type="text" id="nombre_completo" name="nombre_completo" class="input" required>
                </div>

                <div class="form-group">
                    <label class="label">Fecha de Nacimiento *</label>
                    <input type="date" id="fecha_nac" name="fecha_nac" class="input" required>
                </div>

                <div class="form-group">
                    <label class="label">Club</label>
                    <select id="club" name="club" class="select">
                        <option value="">Cargando clubes...</option>
                    </select>
                </div>

                <div class="border-t">
                    <h3>Equipación</h3>
                    <p style="font-size: 0.875rem; color: #6b7280; margin-bottom: 1rem;">
                        Marca los elementos de equipación que posee el alumno
                    </p>

                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem;">
                        <div class="checkbox-group">
                            <input type="checkbox" id="casco" name="casco" class="checkbox">
                            <label class="label">Casco</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="patines" name="patines" class="checkbox">
                            <label class="label">Patines</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="guantes" name="guantes" class="checkbox">
                            <label class="label">Guantes</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="palo" name="palo" class="checkbox">
                            <label class="label">Palo</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="pads" name="pads" class="checkbox">
                            <label class="label">Pads</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="pants" name="pants" class="checkbox">
                            <label class="label">Pants</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="coderas" name="coderas" class="checkbox">
                            <label class="label">Coderas</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="pechera" name="pechera" class="checkbox">
                            <label class="label">Pechera</label>
                        </div>
                    </div>
                </div>

                <div class="border-t">
                    <h3>Datos del Adulto Responsable</h3>

                    <div class="form-group">
                        <label class="label">Nombre *</label>
                        <input type="text" id="nombre_adulto" name="nombre_adulto" class="input" required>
                    </div>

                    <div class="form-group">
                        <label class="label">Teléfono *</label>
                        <input type="number" id="telefono_adulto" name="telefono_adulto" class="input" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Registrar Alumno
                </button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        const form = document.getElementById('registroForm');
        const submitBtn = document.getElementById('submitBtn');
        const clubSelect = document.getElementById('club');

        // Cargar clubes al iniciar
        async function loadClubes() {
            try {
                const clubes = await fetchClubes();
                clubSelect.innerHTML = '<option value="">-- Selecciona un club --</option>';
                clubes.forEach(club => {
                    const option = document.createElement('option');
                    option.value = club.id;
                    option.textContent = club.nombre;
                    clubSelect.appendChild(option);
                });
            } catch (error) {
                clubSelect.innerHTML = '<option value="">Error cargando clubes</option>';
                showMessage('message', 'error', 'Error cargando clubes');
            }
        }

        // Cargar clubes al cargar la página
        loadClubes();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validar formulario
            if (!validateForm(form)) {
                return;
            }

            // Deshabilitar botón
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registrando...';

            try {
                const clubValue = document.getElementById('club').value;
                const formData = {
                    dni: parseInt(document.getElementById('dni').value),
                    nombre_completo: document.getElementById('nombre_completo').value,
                    fecha_nac: document.getElementById('fecha_nac').value,
                    club_id: clubValue ? parseInt(clubValue) : null,
                    casco: document.getElementById('casco').checked,
                    patines: document.getElementById('patines').checked,
                    guantes: document.getElementById('guantes').checked,
                    palo: document.getElementById('palo').checked,
                    pads: document.getElementById('pads').checked,
                    pants: document.getElementById('pants').checked,
                    coderas: document.getElementById('coderas').checked,
                    pechera: document.getElementById('pechera').checked,
                    nombre_adulto: document.getElementById('nombre_adulto').value,
                    telefono_adulto: parseInt(document.getElementById('telefono_adulto').value)
                };

                const response = await supabaseRequest('alumnos', 'POST', formData);

                if (response.ok) {
                    showMessage('message', 'success', '¡Alumno registrado exitosamente!');
                    form.reset();
                } else {
                    showMessage('message', 'error', 'Error al registrar. Verifica que el DNI no esté duplicado.');
                }
            } catch (error) {
                showMessage('message', 'error', 'Error de conexión con el servidor');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Registrar Alumno';
            }
        });
    </script>
</body>
</html>
