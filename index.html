<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club de Hockey - Asistencia</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; }
        .container { max-width: 48rem; margin: 0 auto; padding: 1rem; min-height: 100vh; background: linear-gradient(to bottom right, #eff6ff, #e0e7ff); }
        .card { background: white; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .card-padding { padding: 1.5rem; }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .title { font-size: 1.875rem; font-weight: bold; color: #312e81; }
        .subtitle { color: #4b5563; margin-top: 0.5rem; }
        .tabs { display: flex; border-bottom: 1px solid #e5e7eb; }
        .tab { flex: 1; padding: 1rem 1.5rem; font-weight: 600; background: #f3f4f6; color: #4b5563; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 0.2s; }
        .tab:hover { background: #e5e7eb; }
        .tab.active { background: #4f46e5; color: white; }
        .form-group { margin-bottom: 1rem; }
        .label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.25rem; }
        .input, .select { width: 100%; padding: 0.5rem 1rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 1rem; }
        .input:focus, .select:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
        .checkbox { width: 1rem; height: 1rem; }
        .btn { width: 100%; padding: 0.75rem; border-radius: 0.5rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover:not(:disabled) { background: #4338ca; }
        .btn-success { background: #059669; color: white; }
        .btn-success:hover:not(:disabled) { background: #047857; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover:not(:disabled) { background: #b91c1c; }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .alert { padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .space-y { margin-top: 1rem; }
        .border-t { border-top: 1px solid #e5e7eb; padding-top: 1rem; margin-top: 1rem; }
        .info-box { background: #eef2ff; padding: 1rem; border-radius: 0.5rem; }
        .info-text { font-size: 0.875rem; color: #312e81; font-weight: 500; }
        h3 { font-weight: 600; color: #111827; margin-bottom: 0.75rem; }
        .admin-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .admin-tab { padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid #d1d5db; background: white; cursor: pointer; font-size: 0.875rem; font-weight: 500; }
        .admin-tab.active { background: #4f46e5; color: white; border-color: #4f46e5; }
        .table-container { overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        .table th { background: #f9fafb; padding: 0.75rem; text-align: left; font-weight: 600; border-bottom: 2px solid #e5e7eb; }
        .table td { padding: 0.75rem; border-bottom: 1px solid #e5e7eb; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Simple SVG Icons
        const Users = () => (
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        );

        const ClipboardCheck = () => (
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            <polyline points="9 11 12 14 22 4"></polyline>
          </svg>
        );

        const AlertCircle = ({ size = 20 }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        );

        const CheckCircle = ({ size = 20 }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        );

        const Lock = () => (
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        );

        // SUPABASE CONFIG
        const SUPABASE_URL = 'https://hyaylmjonddryasmqnru.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Q9zhlCA4uoWhi2o50vOXUA_gkjm-JI1';

        const HockeyAttendanceApp = () => {
          const [activeTab, setActiveTab] = useState('register');
          const [alumnos, setAlumnos] = useState([]);
          const [message, setMessage] = useState({ type: '', text: '' });
          const [loading, setLoading] = useState(false);
          const [adminView, setAdminView] = useState('attendance');
          const [nextSessionAttendance, setNextSessionAttendance] = useState([]);

          const [formData, setFormData] = useState({
            dni: '',
            nombre_completo: '',
            fecha_nac: '',
            equipacion: false,
            club: '',
            nombre_adulto: '',
            telefono_adulto: ''
          });

          const [selectedAlumno, setSelectedAlumno] = useState('');
          const [nextSessionDate, setNextSessionDate] = useState('');

          useEffect(() => {
            if (activeTab === 'attendance') {
              fetchAlumnos();
              setNextSessionDate(getNextSaturday());
            }
            if (activeTab === 'admin') {
              fetchAlumnos();
              setNextSessionDate(getNextSaturday());
              if (adminView === 'attendance') {
                fetchNextSessionAttendance();
              }
            }
          }, [activeTab, adminView]);

          const getNextSaturday = () => {
            const today = new Date();
            const dayOfWeek = today.getDay();
            const daysUntilSaturday = (6 - dayOfWeek + 7) % 7 || 7;
            const nextSat = new Date(today);
            nextSat.setDate(today.getDate() + daysUntilSaturday);
            return nextSat.toISOString().split('T')[0];
          };

          const fetchAlumnos = async () => {
            try {
              const response = await fetch(`${SUPABASE_URL}/rest/v1/alumnos?select=dni,nombre_completo,fecha_nac,club,equipacion,nombre_adulto,telefono_adulto&order=nombre_completo.asc`, {
                headers: {
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
              });
              const data = await response.json();
              setAlumnos(data);
            } catch (error) {
              showMessage('error', 'Error cargando alumnos');
            }
          };

          const fetchNextSessionAttendance = async () => {
            try {
              const nextDate = getNextSaturday();
              const response = await fetch(
                `${SUPABASE_URL}/rest/v1/asistencia?select=alumno_dni,presente&fecha=eq.${nextDate}`,
                {
                  headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                  }
                }
              );
              const data = await response.json();
              setNextSessionAttendance(data);
            } catch (error) {
              showMessage('error', 'Error cargando asistencia');
            }
          };

          const showMessage = (type, text) => {
            setMessage({ type, text });
            setTimeout(() => setMessage({ type: '', text: '' }), 4000);
          };

          const handleInputChange = (e) => {
            const { name, value, type, checked } = e.target;
            setFormData(prev => ({
              ...prev,
              [name]: type === 'checkbox' ? checked : value
            }));
          };

          const handleRegister = async (e) => {
            e.preventDefault();
            setLoading(true);

            try {
              const response = await fetch(`${SUPABASE_URL}/rest/v1/alumnos`, {
                method: 'POST',
                headers: {
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                  ...formData,
                  dni: parseInt(formData.dni),
                  telefono_adulto: parseInt(formData.telefono_adulto)
                })
              });

              if (response.ok) {
                showMessage('success', '¡Alumno registrado exitosamente!');
                setFormData({
                  dni: '',
                  nombre_completo: '',
                  fecha_nac: '',
                  equipacion: false,
                  club: '',
                  nombre_adulto: '',
                  telefono_adulto: ''
                });
              } else {
                showMessage('error', 'Error al registrar. Verifica los datos.');
              }
            } catch (error) {
              showMessage('error', 'Error de conexión');
            } finally {
              setLoading(false);
            }
          };

          const handleAttendance = async (presente) => {
            if (!selectedAlumno) {
              showMessage('error', 'Selecciona un alumno');
              return;
            }

            setLoading(true);
            try {
              const response = await fetch(`${SUPABASE_URL}/rest/v1/asistencia`, {
                method: 'POST',
                headers: {
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal'
                },
                body: JSON.stringify({
                  alumno_dni: parseInt(selectedAlumno),
                  fecha: nextSessionDate,
                  presente: presente
                })
              });

              if (response.ok) {
                showMessage('success', `Asistencia registrada: ${presente === 'si' ? 'Asistirá' : 'No asistirá'}`);
                setSelectedAlumno('');
              } else {
                showMessage('error', 'Error al registrar asistencia');
              }
            } catch (error) {
              showMessage('error', 'Error de conexión');
            } finally {
              setLoading(false);
            }
          };

          const getAttendanceForAlumno = (dni) => {
            const attendance = nextSessionAttendance.find(a => a.alumno_dni === dni);
            return attendance ? attendance.presente : 'No confirmado';
          };

          return (
            <div className="container">
              <div className="card header card-padding">
                <h1 className="title">🏒 Club de Hockey</h1>
                <p className="subtitle">Sistema de Registro y Asistencia</p>
              </div>

              {message.text && (
                <div className={`alert ${message.type === 'success' ? 'alert-success' : 'alert-error'}`}>
                  {message.type === 'success' ? <CheckCircle size={20} /> : <AlertCircle size={20} />}
                  <span>{message.text}</span>
                </div>
              )}

              <div className="card">
                <div className="tabs">
                  <button onClick={() => setActiveTab('register')} className={`tab ${activeTab === 'register' ? 'active' : ''}`}>
                    <Users />
                    <span>Registrar</span>
                  </button>
                  <button onClick={() => setActiveTab('attendance')} className={`tab ${activeTab === 'attendance' ? 'active' : ''}`}>
                    <ClipboardCheck />
                    <span>Asistencia</span>
                  </button>
                  <button onClick={() => setActiveTab('admin')} className={`tab ${activeTab === 'admin' ? 'active' : ''}`}>
                    <Lock />
                    <span>Profesores</span>
                  </button>
                </div>

                {activeTab === 'register' && (
                  <div className="card-padding">
                    <div className="form-group">
                      <label className="label">DNI del Alumno</label>
                      <input type="number" name="dni" value={formData.dni} onChange={handleInputChange} className="input" required />
                    </div>

                    <div className="form-group">
                      <label className="label">Nombre Completo</label>
                      <input type="text" name="nombre_completo" value={formData.nombre_completo} onChange={handleInputChange} className="input" required />
                    </div>

                    <div className="form-group">
                      <label className="label">Fecha de Nacimiento</label>
                      <input type="date" name="fecha_nac" value={formData.fecha_nac} onChange={handleInputChange} className="input" required />
                    </div>

                    <div className="form-group">
                      <label className="label">Club</label>
                      <input type="text" name="club" value={formData.club} onChange={handleInputChange} className="input" />
                    </div>

                    <div className="form-group checkbox-group">
                      <input type="checkbox" name="equipacion" checked={formData.equipacion} onChange={handleInputChange} className="checkbox" />
                      <label className="label">Tiene equipación</label>
                    </div>

                    <div className="border-t">
                      <h3>Datos del Adulto Responsable</h3>
                      
                      <div className="form-group">
                        <label className="label">Nombre</label>
                        <input type="text" name="nombre_adulto" value={formData.nombre_adulto} onChange={handleInputChange} className="input" required />
                      </div>

                      <div className="form-group">
                        <label className="label">Teléfono</label>
                        <input type="number" name="telefono_adulto" value={formData.telefono_adulto} onChange={handleInputChange} className="input" required />
                      </div>
                    </div>

                    <button onClick={handleRegister} disabled={loading} className="btn btn-primary">
                      {loading ? 'Registrando...' : 'Registrar Alumno'}
                    </button>
                  </div>
                )}

                {activeTab === 'attendance' && (
                  <div className="card-padding">
                    <div className="info-box">
                      <p className="info-text">
                        Próxima sesión: <strong>{new Date(nextSessionDate).toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</strong>
                      </p>
                    </div>

                    <div className="form-group space-y">
                      <label className="label">Selecciona al alumno</label>
                      <select value={selectedAlumno} onChange={(e) => setSelectedAlumno(e.target.value)} className="select">
                        <option value="">-- Selecciona un alumno --</option>
                        {alumnos.map((alumno) => (
                          <option key={alumno.dni} value={alumno.dni}>{alumno.nombre_completo}</option>
                        ))}
                      </select>
                    </div>

                    <div className="grid-2 space-y">
                      <button onClick={() => handleAttendance('si')} disabled={loading || !selectedAlumno} className="btn btn-success">
                        <CheckCircle size={24} />
                        <span>Sí Asiste</span>
                      </button>
                      <button onClick={() => handleAttendance('no')} disabled={loading || !selectedAlumno} className="btn btn-danger">
                        <AlertCircle size={24} />
                        <span>No Asiste</span>
                      </button>
                    </div>
                  </div>
                )}

                {activeTab === 'admin' && (
                  <div className="card-padding">
                    <h3>Panel de Profesores</h3>
                    
                    <div className="admin-tabs">
                      <button onClick={() => setAdminView('attendance')} className={adminView === 'attendance' ? 'admin-tab active' : 'admin-tab'}>
                        Próxima Clase
                      </button>
                      <button onClick={() => setAdminView('all')} className={adminView === 'all' ? 'admin-tab active' : 'admin-tab'}>
                        Todos
                      </button>
                    </div>

                    {adminView === 'attendance' && (
                      <div>
                        <div className="info-box">
                          <p className="info-text">
                            Próxima sesión: <strong>{nextSessionDate && new Date(nextSessionDate).toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</strong>
                          </p>
                        </div>

                        <div className="table-container space-y">
                          <table className="table">
                            <thead>
                              <tr>
                                <th>Alumno</th>
                                <th>Edad</th>
                                <th>Equipación</th>
                                <th>Estado</th>
                              </tr>
                            </thead>
                            <tbody>
                              {alumnos.length > 0 ? alumnos.map((alumno) => {
                                const status = getAttendanceForAlumno(alumno.dni);
                                const age = alumno.fecha_nac ? Math.floor((new Date() - new Date(alumno.fecha_nac)) / (1000 * 60 * 60 * 24 * 365.25)) : '-';
                                return (
                                  <tr key={alumno.dni}>
                                    <td>{alumno.nombre_completo}</td>
                                    <td>{age}</td>
                                    <td>{alumno.equipacion ? '✓' : '✗'}</td>
                                    <td>
                                      {status === 'si' && <span className="badge badge-success">Asiste</span>}
                                      {status === 'no' && <span className="badge badge-danger">No Asiste</span>}
                                      {status === 'No confirmado' && <span className="badge badge-warning">Sin confirmar</span>}
                                    </td>
                                  </tr>
                                );
                              }) : (
                                <tr><td colSpan="4">No hay alumnos registrados</td></tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {adminView === 'all' && (
                      <div className="table-container space-y">
                        <table className="table">
                          <thead>
                            <tr>
                              <th>DNI</th>
                              <th>Nombre</th>
                              <th>Fecha Nac.</th>
                              <th>Club</th>
                              <th>Equip.</th>
                              <th>Adulto</th>
                              <th>Teléfono</th>
                            </tr>
                          </thead>
                          <tbody>
                            {alumnos.length > 0 ? alumnos.map((alumno) => (
                              <tr key={alumno.dni}>
                                <td>{alumno.dni}</td>
                                <td>{alumno.nombre_completo}</td>
                                <td>{alumno.fecha_nac && new Date(alumno.fecha_nac).toLocaleDateString('es-ES')}</td>
                                <td>{alumno.club || '-'}</td>
                                <td>{alumno.equipacion ? '✓' : '✗'}</td>
                                <td>{alumno.nombre_adulto}</td>
                                <td>{alumno.telefono_adulto}</td>
                              </tr>
                            )) : (
                              <tr><td colSpan="7">No hay alumnos registrados</td></tr>
                            )}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HockeyAttendanceApp />);
    </script>
</body>
</html>
